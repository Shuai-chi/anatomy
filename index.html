<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1020" />
    <title>全身訓練解剖對照</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, "Noto Sans TC", system-ui, sans-serif; background:#0b1020; color:#eef2ff; }
      * { box-sizing:border-box; } html,body,#app { width:100%; height:100%; margin:0; overflow:hidden; }
      #app { position:relative; } #renderCanvas { display:block; width:100%; height:100%; outline:0; touch-action:none; }
      .panel { position:absolute; top:1rem; left:1rem; width:min(25rem,calc(100% - 2rem)); max-height:calc(100% - 2rem); overflow-y:auto; padding:1rem 1.15rem; border:1px solid rgb(148 163 184 / 25%); border-radius:1rem; background:rgb(10 16 32 / 91%); box-shadow:0 1rem 3rem rgb(0 0 0 / 34%); backdrop-filter:blur(12px); }
      .eyebrow { margin:0 0 .3rem; color:#fb923c; font-size:.7rem; font-weight:750; letter-spacing:.12em; text-transform:uppercase; } h1 { margin:0 0 .85rem; font-size:1.25rem; }
      label,h2 { display:block; margin:.9rem 0 .35rem; color:#94a3b8; font-size:.74rem; letter-spacing:.06em; text-transform:uppercase; } h2 { margin-bottom:.45rem; }
      select { width:100%; padding:.55rem .6rem; border:1px solid rgb(148 163 184 / 30%); border-radius:.5rem; background:#16203a; color:#eef2ff; font:inherit; } input[type="range"] { width:100%; accent-color:#fb923c; } .pose-caption { color:#94a3b8; font-size:.7rem; margin-top:.18rem; }
      .pose-row { display:flex; align-items:center; gap:.55rem; } .pose-row input[type="range"] { flex:1; }
      .play { flex:0 0 auto; width:2.4rem; margin:0; padding:.4rem 0; font-size:.72rem; }
      .pose-note { margin-top:.35rem; padding:.5rem .6rem; border-left:3px solid rgb(148 163 184 / 45%); border-radius:.3rem; background:rgb(148 163 184 / 9%); color:#cbd5e1; font-size:.72rem; line-height:1.55; }
      .hint-inline { color:#64748b; font-size:.68rem; text-transform:none; letter-spacing:0; }
      .layers { display:grid; grid-template-columns:repeat(3,1fr); gap:.4rem; } .layer { display:flex; align-items:center; gap:.3rem; margin:0; padding:.45rem; border:1px solid rgb(148 163 184 / 20%); border-radius:.45rem; background:rgb(22 32 58 / 72%); color:#cbd5e1; font-size:.75rem; text-transform:none; letter-spacing:0; cursor:pointer; } .layer input { margin:0; accent-color:#fb923c; }
      .meta,.readout { display:grid; gap:.35rem; font-size:.78rem; line-height:1.45; } .row { display:grid; grid-template-columns:5rem minmax(0,1fr); gap:.5rem; padding:.48rem .58rem; border:1px solid rgb(59 130 246 / 20%); border-radius:.45rem; background:rgb(59 130 246 / 8%); } .key { color:#64748b; } .value { color:#cbd5e1; overflow-wrap:anywhere; }
      .muscle { padding:.42rem 0; border-top:1px solid rgb(148 163 184 / 13%); font-size:.8rem; } .muscle-top { display:flex; align-items:baseline; gap:.45rem; } .swatch { width:.7rem; height:.7rem; flex:0 0 auto; border-radius:50%; } .mname { flex:1; } .mrole { color:#94a3b8; font-size:.7rem; } .mnote { margin:.15rem 0 0 1.15rem; color:#94a3b8; font-size:.71rem; line-height:1.45; }
      .rom-badge { margin:.45rem 0 .3rem; padding:.35rem .55rem; border-radius:.4rem; font-size:.72rem; font-weight:650; }
      .rom-badge.ok { border:1px solid rgb(34 197 94 / 35%); background:rgb(34 197 94 / 12%); color:#86efac; }
      .rom-badge.limit { border:1px solid #ef4444; background:rgb(239 68 68 / 18%); color:#fca5a5; }
      .rom-badge.locked { border:1px solid rgb(148 163 184 / 35%); background:rgb(148 163 184 / 12%); color:#cbd5e1; }
      .rom-row { display:grid; grid-template-columns:5.6rem 2.6rem minmax(0,1fr); gap:.35rem .5rem; align-items:baseline; padding:.3rem 0; border-top:1px solid rgb(148 163 184 / 12%); font-size:.73rem; }
      .rom-name { color:#cbd5e1; } .rom-value { color:#fdba74; font-variant-numeric:tabular-nums; text-align:right; } .rom-range { color:#64748b; font-variant-numeric:tabular-nums; }
      .rom-bar { grid-column:1 / -1; height:.22rem; border-radius:.2rem; background:rgb(148 163 184 / 22%); position:relative; }
      .rom-bar::after { content:""; position:absolute; inset:0 auto 0 0; width:var(--fill,0%); border-radius:.2rem; background:#fb923c; }
      .rom-row.at-limit .rom-value { color:#fca5a5; } .rom-row.at-limit .rom-bar::after { background:#ef4444; }
      .caveat { margin-top:.75rem; padding:.75rem; border:1px solid #f97316; border-left:4px solid #fb923c; border-radius:.55rem; background:rgb(194 65 12 / 21%); color:#fed7aa; font-size:.78rem; font-weight:600; line-height:1.55; } .caveat strong { display:block; margin-bottom:.25rem; color:#fdba74; font-size:.72rem; letter-spacing:.06em; }
      button { width:100%; margin-top:.75rem; padding:.55rem; border:1px solid rgb(251 146 60 / 35%); border-radius:.5rem; background:rgb(251 146 60 / 13%); color:#fdba74; font:inherit; cursor:pointer; } #status { margin-top:.7rem; color:#86efac; font: .7rem ui-monospace,monospace; line-height:1.4; } #hint { position:absolute; right:1rem; bottom:1rem; max-width:34rem; padding:.45rem .65rem; border-radius:.4rem; background:rgb(10 16 32 / 72%); color:#94a3b8; font-size:.7rem; text-align:right; }
      @media (max-width:640px) { .panel { top:.55rem; left:.55rem; width:calc(100% - 1.1rem); max-height:calc(100% - 1.1rem); } #hint { display:none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="renderCanvas"></canvas>
      <aside class="panel" aria-label="訓練解剖控制面板">
        <p class="eyebrow" data-i18n="eyebrow">WP5 · 全身解剖</p><h1 data-i18n="title">動作 → 全身肌群</h1>
        <label for="language" data-i18n="language">語言</label>
        <select id="language" aria-label="語言" data-i18n-exempt="language-picker"><option value="zh">中文</option><option value="en">English</option></select>
        <label for="exercise" data-i18n="exercise">選擇動作</label><select id="exercise" aria-label="選擇動作"></select>
        <label for="posePhase" data-i18n="pose">示意姿勢（非動作捕捉）</label>
        <div class="pose-row">
          <input id="posePhase" type="range" min="0" max="1" step="0.01" value="0" aria-label="示意姿勢" />
          <button id="playPose" class="play" type="button">播放</button>
        </div>
        <div id="poseCaption" class="pose-caption">起始姿勢 → 結束姿勢</div>
        <div id="poseNote" class="pose-note" hidden></div>
        <h2><span data-i18n="layers">顯示圖層</span> <span class="hint-inline" data-i18n="layersHint">（筋膜預設關閉：它覆蓋在肌肉外層，開啟會遮住高亮）</span></h2>
        <div class="layers">
          <label class="layer"><input id="layerBone" type="checkbox" checked /><span data-i18n="layerBone">骨骼</span></label>
          <label class="layer"><input id="layerMuscle" type="checkbox" checked /><span data-i18n="layerMuscle">肌肉</span></label>
          <label class="layer"><input id="layerFascia" type="checkbox" /><span data-i18n="layerFascia">筋膜</span></label>
        </div>
        <h2 data-i18n="info">動作資訊</h2><div class="meta" id="meta"></div><div class="caveat" id="caveat" hidden></div>
        <h2 data-i18n="muscles">肌肉參與</h2><div id="muscles"></div>
        <h2><span data-i18n="rom">關節活動度</span> <span class="hint-inline" data-i18n="romHint">拖曳只調整屈曲與外展；軸向旋轉與水平內收由動作姿勢設定。</span></h2>
        <select id="romJoint" aria-label="關節活動度"></select>
        <div id="romBadge" class="rom-badge ok" hidden></div>
        <div id="romList"></div>
        <h2 data-i18n="status">模型狀態</h2>
        <div class="readout">
          <div class="row"><span class="key" data-i18n="selectedMeshLabel">選取網格</span><span class="value" id="selectedMesh">尚未選取</span></div>
          <div class="row"><span class="key" data-i18n="draggedJointLabel">拖曳關節</span><span class="value" id="draggedJoint">無</span></div>
        </div>
        <button id="resetPose" type="button" data-i18n="reset">重置姿勢</button><div id="status" role="status">正在載入全身模型…</div>
      </aside>
      <div id="hint">拖曳橘色關節球改變肢體方向 · 點選模型辨識網格 · 拖曳空白處旋轉視角 · 滾輪縮放</div>
    </div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
